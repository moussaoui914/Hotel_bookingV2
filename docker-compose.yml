services:

  postgres:
    image: postgres:17
    container_name: hotel_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: Hotel
      POSTGRES_USER: abderrahim
      POSTGRES_PASSWORD: MS_2004
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abderrahim -d Hotel"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: